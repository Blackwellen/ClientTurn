# Dependency updates (internal review IR-13). Weekly, grouped so minor and
# patch bumps arrive as one pull request that CI (.github/workflows/ci.yml)
# checks before anyone merges it. Security updates are raised as they are
# published, independently of this schedule, once "Dependabot security
# updates" is switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels:
      - dependencies

    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7F34A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B7F34A" stop-opacity="0"/>

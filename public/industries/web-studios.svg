<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.15" r="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="0.7" stop-color="#0B1020"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F7F9FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F34A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B7F34A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- browser window -->
  <g transform="translate(230 150)">
    <rect width="640" height="470" rx="18" fill="#121a30" stroke="#F7F9FC" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h604a18 18 0 0 1 18 18v34H0z" fill="#18213b"/>
    <circle cx="28" cy="26" r="7" fill="#F7F9FC" fill-opacity="0.25"/>
    <circle cx="52" cy="26" r="7" fill="#F7F9FC" fill-opacity="0.25"/>
    <circle cx="76" cy="26" r="7" fill="#B7F34A"/>
    <rect x="120" y="14" width="400" height="24" rx="12" fill="#0B1020" fill-opacity="0.8"/>
    <rect x="136" y="23" width="150" height="6" rx="3" fill="#F7F9FC" fill-opacity="0.3"/>

    <!-- nav -->
    <rect x="36" y="78" width="70" height="12" rx="6" fill="#B7F34A"/>
    <rect x="400" y="80" width="46" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.3"/>
    <rect x="462" y="80" width="46" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.3"/>
    <rect x="524" y="74" width="80" height="20" rx="10" fill="none" stroke="#B7F34A" stroke-width="2"/>

    <!-- hero copy -->
    <rect x="36" y="134" width="260" height="22" rx="6" fill="#F7F9FC" fill-opacity="0.9"/>
    <rect x="36" y="168" width="200" height="22" rx="6" fill="#F7F9FC" fill-opacity="0.9"/>
    <rect x="36" y="210" width="240" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.3"/>
    <rect x="36" y="228" width="210" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.3"/>
    <rect x="36" y="258" width="112" height="32" rx="16" fill="#B7F34A"/>

    <!-- hero image placeholder -->
    <rect x="336" y="124" width="268" height="170" rx="12" fill="url(#img)" stroke="#B7F34A" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M356 274l62-70 44 46 34-30 88 54z" fill="#B7F34A" fill-opacity="0.35"/>
    <circle cx="552" cy="162" r="16" fill="#E7FFC0" fill-opacity="0.7"/>

    <!-- cards -->
    <g fill="#18213b" stroke="#F7F9FC" stroke-opacity="0.1" stroke-width="2">
      <rect x="36" y="324" width="176" height="112" rx="12"/>
      <rect x="232" y="324" width="176" height="112" rx="12"/>
      <rect x="428" y="324" width="176" height="112" rx="12"/>
    </g>
    <g fill="#F7F9FC" fill-opacity="0.28">
      <rect x="56" y="386" width="120" height="8" rx="4"/>
      <rect x="56" y="404" width="96" height="8" rx="4"/>
      <rect x="252" y="386" width="120" height="8" rx="4"/>
      <rect x="252" y="404" width="96" height="8" rx="4"/>
      <rect x="448" y="386" width="120" height="8" rx="4"/>
      <rect x="448" y="404" width="96" height="8" rx="4"/>
    </g>
    <rect x="56" y="346" width="28" height="28" rx="8" fill="#B7F34A" fill-opacity="0.8"/>
    <rect x="252" y="346" width="28" height="28" rx="8" fill="#E7FFC0" fill-opacity="0.6"/>
    <rect x="448" y="346" width="28" height="28" rx="8" fill="#F7F9FC" fill-opacity="0.5"/>

    <!-- selection box on the headline -->
    <rect x="28" y="126" width="276" height="72" fill="none" stroke="#B7F34A" stroke-width="2" stroke-dasharray="8 6"/>
    <g fill="#0B1020" stroke="#B7F34A" stroke-width="2">
      <rect x="22" y="120" width="12" height="12"/>
      <rect x="298" y="120" width="12" height="12"/>
      <rect x="22" y="192" width="12" height="12"/>
      <rect x="298" y="192" width="12" height="12"/>
    </g>
  </g>

  <!-- palette card -->
  <g transform="translate(910 190)">
    <rect width="150" height="232" rx="16" fill="#121a30" stroke="#F7F9FC" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="22" y="22" width="64" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.35"/>
    <circle cx="44" cy="74" r="20" fill="#B7F34A"/>
    <circle cx="104" cy="74" r="20" fill="#E7FFC0"/>
    <circle cx="44" cy="130" r="20" fill="#F7F9FC"/>
    <circle cx="104" cy="130" r="20" fill="#0B1020" stroke="#F7F9FC" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="22" y="176" width="106" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.25"/>
    <rect x="22" y="194" width="78" height="8" rx="4" fill="#F7F9FC" fill-opacity="0.25"/>
  </g>

  <!-- pen path -->
  <g transform="translate(80 470)" fill="none">
    <path d="M20 120C60 20 150 20 190 90" stroke="#B7F34A" stroke-width="3"/>
    <path d="M60 36L20 120M150 36L190 90" stroke="#E7FFC0" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="60" cy="36" r="6" fill="#0B1020" stroke="#E7FFC0" stroke-width="2"/>
    <circle cx="150" cy="36" r="6" fill="#0B1020" stroke="#E7FFC0" stroke-width="2"/>
    <rect x="13" y="113" width="14" height="14" fill="#B7F34A"/>
    <rect x="183" y="83" width="14" height="14" fill="#B7F34A"/>
  </g>

  <!-- cursor -->
  <path d="M808 520l0 70 18-17 12 29 13-6-12-28 25-2z" fill="#F7F9FC" stroke="#0B1020" stroke-width="3" stroke-linejoin="round"/>
</svg>
